server {
    listen 80;
    listen [::]:80;
    server_name nuffy.sk www.nuffy.sk;
    return 301 https://nuffy.sk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nuffy.sk;

    root /var/www/nuffy/public;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/nuffy.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuffy.sk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nuffy.sk;
    ssl_certificate     /etc/letsencrypt/live/nuffy.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuffy.sk/privkey.pem;
    return 301 https://nuffy.sk$request_uri;
}
